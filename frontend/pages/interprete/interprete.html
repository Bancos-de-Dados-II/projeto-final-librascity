<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Intérprete - LibrasCity</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../../styles/reset.css">
    <link rel="stylesheet" href="./interprete.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header class="cabecalho">
            <div class="logo">
                <h2>
                    Libras City
                    <i class="fa-regular fa-hand"></i>
                </h2>
            </div>
            <button class="menu-mobile" id="menu-mobile">
                <i class="fa-solid fa-bars"></i>
            </button>
            <nav id="menu">
                <a href="#" class="active">Intérprete</a>
                <a href="#" id="logoutLink">Sair</a>
            </nav>
        </header>

        <section class="hero">
            <h1>Painel do Intérprete</h1>
            <p>Receba e responda chamados de emergência em tempo real</p>
        </section>

        <section class="stats">
            <div class="card">
                <i class="fa-solid fa-phone-volume"></i>
                <h2 id="hojeCount">0</h2>
                <small>HOJE</small>
            </div>
            <div class="card">
                <i class="fa-regular fa-circle-check"></i>
                <h2 id="totalCount">0</h2>
                <small>TOTAL</small>
            </div>
            <div class="card">
                <i class="fa-regular fa-clock"></i>
                <h2 id="horasCount">0h</h2>
                <small>HORAS</small>
            </div>
        </section>

        <section class="calls">
            <div class="calls-header">
                <h3>CHAMADOS ATIVOS</h3>
                <span class="badge" id="pendentesBadge">0 pendentes</span>
            </div>
            <div id="callsList">
                <p class="no-calls">Nenhum chamado pendente no momento.</p>
            </div>
        </section>

        <section class="map" id="mapContainer">
            <div id="map" style="height: 100%; width: 100%; border-radius: 22px;"></div>
        </section>

        <section class="current-call" id="currentCall" style="display: none;">
            <div class="avatar" id="callAvatar">M</div>
            <div class="details">
                <h2 id="callNome">Maria S.</h2>
                <p id="callLocal">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Carregando...</span>
                </p>
                <span class="photo" id="callFoto">
                    <i class="fa-regular fa-image"></i>
                    <span>Sem foto</span>
                </span>
                <p class="context" id="callContexto">
                    <strong>Contexto:</strong> <span>Carregando...</span>
                </p>
            </div>
            <div class="actions">
                <button id="acceptBtn" class="btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i>
                    Aceitar e abrir WhatsApp
                </button>
            </div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../js/menuResponsivo.js"></script>
    <script type="module" src="../../js/interprete.js"></script>
</body>
</html>
